<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEEN MONSTER | Official</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(ellipse at top,#32104d,transparent 55%),#090711;
 color:white;
 font-family:Tahoma,Arial,sans-serif;
 line-height:1.9;
}
header{
 position:sticky;top:0;z-index:5;
 background:#090711ed;
 border-bottom:1px solid #49315e;
 padding:15px;
 text-align:center;
}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#ef55ff}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button{
 border:0;border-radius:10px;padding:10px 15px;
 background:linear-gradient(120deg,#a855f7,#7025c9);
 color:white;cursor:pointer;font-size:14px;
}
.wrap{width:min(1000px,92%);margin:auto}
.hero{text-align:center;padding:65px 0}
.hero h1{
 font-size:clamp(38px,8vw,78px);
 color:#e3b4ff;
 margin:15px 0;
}
.section{padding:25px 0 40px;scroll-margin-top:130px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:16px;
}
.card{
 padding:18px;
 background:linear-gradient(145deg,#20142f,#110d19);
 border:1px solid #49315e;
 border-radius:18px;
 overflow-wrap:anywhere;
}
.photo{
 height:210px;border-radius:12px;
 background:#32134d;display:grid;
 place-items:center;overflow:hidden;
 font-size:55px;margin-bottom:12px;
}
.photo img{width:100%;height:100%;object-fit:cover}
input,textarea,select{
 display:block;width:100%;padding:12px;
 margin:7px 0 15px;background:#0d0a14;
 border:1px solid #4b3560;border-radius:9px;
 color:white;font:inherit;
}
textarea{min-height:100px}
.muted{color:#c4b5d5}
.member{cursor:pointer}
.member:hover{border-color:#ef55ff}
[hidden]{display:none!important}
footer{text-align:center;padding:25px;color:#c4b5d5}
</style>
</head>
<body>
<header>
 <div class="logo">TEEN <span>MONSTER</span></div>
 <nav>
  <button onclick="go('home')">خانه</button>
  <button onclick="go('members')">اعضا</button>
  <button onclick="go('manage')">مدیریت اعضا</button>
 </nav>
</header>
<main class="wrap">
<section class="hero" id="home">
 <p>✦ OFFICIAL GROUP WEBSITE ✦</p>
 <h1>TEEN MONSTER</h1>
 <p>صدای ما، انرژی ما، دنیای ما 💜</p>
 <button onclick="go('members')">دیدن اعضای گروه</button>
</section>
<section class="section" id="members">
 <h2>💜 اعضای گروه</h2>
 <p class="muted">روی کارت هر عضو بزن تا اطلاعاتش را ببینی.</p>
 <div class="grid" id="membersList"></div>
</section>
<section class="section" id="manage">
 <h2>👑 مدیریت اعضا</h2>
 <div class="card">
  <p class="muted">
   این نسخه برای پیش‌نمایش شخصی است.
   اطلاعات در همین مرورگر ذخیره می‌شود.
  </p>
  <label>انتخاب عضو</label>
  <select id="memberSelect" onchange="fillForm()"></select>
  <label>اسم عضو</label>
  <input id="name" maxlength="80" placeholder="اسم عضو">
  <label>نقش عضو</label>
  <input id="role" maxlength="100" placeholder="مثلاً خواننده یا رپر">
  <label>معرفی عضو</label>
  <textarea id="bio" maxlength="1200" placeholder="دربارهٔ عضو بنویس"></textarea>
  <label>لینک عکس (اختیاری)</label>
  <input id="photoUrl" type="url" placeholder="https://...">
  <label>یا انتخاب عکس از گوشی</label>
  <input id="photoFile" type="file" accept="image/*">
  <button onclick="saveMember()">ذخیرهٔ تغییرات 💜</button>
  <button onclick="resetMembers()">بازنشانی اعضا</button>
  <p id="status" class="muted"></p>
 </div>
</section>
</main>
<footer>
 <div class="logo">TEEN <span>MONSTER</span></div>
 <p>با عشق و انرژی بنفش 💜🖤</p>
</footer>
<script>
const defaults=Array.from({length:7},(_,i)=>({
 name:"عضو "+(i+1),
 role:"",
 bio:"معرفی این عضو را می‌توانی از بخش مدیریت تغییر بدهی.",
 photo:""
}));
let members=defaults.map(m=>({...m}));
try{
 const saved=localStorage.getItem("teenMonsterMembers");
 if(saved){
  const parsed=JSON.parse(saved);
  if(Array.isArray(parsed)&&parsed.length===7)members=parsed;
 }
}catch(e){}
function go(id){
 document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
function safeUrl(value){
 try{
  const u=new URL(value,location.href);
  return ["http:","https:","data:"].includes(u.protocol)?u.href:"";
 }catch(e){return "";}
}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 document.getElementById("membersList").innerHTML=members.map((m,i)=>`
  <article class="card member" onclick="showMember(${i})">
   <div class="photo">
    ${m.photo
     ?`<img src="${escapeHTML(safeUrl(m.photo))}" alt="عکس ${escapeHTML(m.name)}">`
     :"🐺"}
   </div>
   <h3>${escapeHTML(m.name)}</h3>
   ${m.role?`<p>💜 ${escapeHTML(m.role)}</p>`:""}
   <p class="muted">${escapeHTML(m.bio)}</p>
   <button type="button">اطلاعات بیشتر</button>
  </article>
 `).join("");
 document.getElementById("memberSelect").innerHTML=members.map((m,i)=>
  `<option value="${i}">${i+1}. ${escapeHTML(m.name)}</option>`
 ).join("");
}
function showMember(i){
 const m=members[i];
 alert(
  m.name+"\n"+
  (m.role?"نقش: "+m.role+"\n":"")+
  "\n"+m.bio
 );
}
function fillForm(){
 const m=members[Number(document.getElementById("memberSelect").value)];
 if(!m)return;
 document.getElementById("name").value=m.name;
 document.getElementById("role").value=m.role;
 document.getElementById("bio").value=m.bio;
 document.getElementById("photoUrl").value=
  m.photo.startsWith("data:")?"":m.photo;
 document.getElementById("photoFile").value="";
}
function save(){
 localStorage.setItem("teenMonsterMembers",JSON.stringify(members));
 render();
 fillForm();
}
function saveMember(){
 const i=Number(document.getElementById("memberSelect").value);
 const file=document.getElementById("photoFile").files[0];
 members[i].name=document.getElementById("name").value.trim()||"عضو "+(i+1);
 members[i].role=document.getElementById("role").value.trim();
 members[i].bio=document.getElementById("bio").value.trim();
 if(file){
  if(!file.type.startsWith("image/")){
   alert("لطفاً یک فایل تصویری انتخاب کن.");
   return;
  }
  if(file.size>1500000){
   alert("حجم عکس باید کمتر از ۱٫۵ مگابایت باشد.");
   return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
   members[i].photo=reader.result;
   save();
   document.getElementById("status").textContent="تغییرات ذخیره شد 💜";
  };
  reader.readAsDataURL(file);
  return;
 }
 const url=document.getElementById("photoUrl").value.trim();
 if(url)members[i].photo=safeUrl(url);
 save();
 document.getElementById("status").textContent="تغییرات ذخیره شد 💜";
}
function resetMembers(){
 if(!confirm("اطلاعات هفت عضو به حالت اولیه برگردد؟"))return;
 members=defaults.map(m=>({...m}));
 save();
 document.getElementById("status").textContent="اعضا بازنشانی شدند.";
}
render();
fillForm();
</script>
</body>
</html>
